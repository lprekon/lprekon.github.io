<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}">
  {{ partial "head.html" . }}
  <body>
    <div class="site">
      {{ partial "header.html" . }}
      <main>
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
    {{ $lightbox := resources.Get "js/lightbox.js" | minify | fingerprint }}
    <script src="{{ $lightbox.RelPermalink }}" integrity="{{ $lightbox.Data.Integrity }}" defer></script>
  </body>
</html>
