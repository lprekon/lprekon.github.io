{{- $opts := dict "displayMode" (eq .Type "block") "output" "htmlAndMathml" -}}
{{- with try (transform.ToMath .Inner $opts) -}}
  {{- with .Err -}}
    {{ errorf "Failed to render math at %s: %s" $.Position . }}
  {{- else -}}
    {{ $.Page.Store.Set "hasMath" true }}
    {{ .Value }}
  {{- end -}}
{{- end -}}
